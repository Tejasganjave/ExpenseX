<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExpenseX | Add Expense</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f1117;
            color: #ffffff;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #151823;
            border-right: 1px solid #292d3a;
            padding: 25px 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #8b5cf6;
            margin-bottom: 35px;
            padding-left: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #aeb4c2;
            padding: 13px 14px;
            border-radius: 10px;
            margin-bottom: 7px;
            transition: 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #252033;
            color: #ffffff;
        }

        .nav-icon {
            width: 25px;
            text-align: center;
        }

        /* MAIN */
        .main {
            flex: 1;
        }

        .topbar {
            height: 70px;
            border-bottom: 1px solid #292d3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .topbar h2 {
            font-size: 20px;
        }

        .account {
            color: #b7bdca;
            font-size: 14px;
        }

        .content {
            padding: 35px;
            max-width: 900px;
        }

        .page-title {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .page-subtitle {
            color: #9299a8;
            margin-bottom: 30px;
        }

        /* FORM CARD */
        .form-card {
            background: #171a24;
            border: 1px solid #292d3a;
            border-radius: 15px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #d8dce5;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            background: #0f1117;
            border: 1px solid #303545;
            border-radius: 9px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #8b5cf6;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        select option {
            background: #171a24;
            color: white;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button,
        .cancel-btn {
            padding: 13px 22px;
            border-radius: 9px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .save-btn {
            background: #8b5cf6;
            color: white;
        }

        .save-btn:hover {
            background: #7c3aed;
        }

        .cancel-btn {
            background: #292d3a;
            color: #ffffff;
        }

        .cancel-btn:hover {
            background: #363b4a;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 13px 15px;
            border-radius: 9px;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #123524;
            color: #6ee7a0;
            border: 1px solid #1e6b45;
        }

        .error {
            display: block;
            background: #3a1717;
            color: #ff8d8d;
            border: 1px solid #702626;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .sidebar {
                width: 190px;
            }

            .content {
                padding: 20px;
            }

            .topbar {
                padding: 0 18px;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">ExpenseX</div>

        <a href="dashboard.html" class="nav-link">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>

        <a href="expenses.html" class="nav-link active">
            <span class="nav-icon">💸</span>
            Expenses
        </a>

        <a href="income.html" class="nav-link">
            <span class="nav-icon">💰</span>
            Income
        </a>

        <a href="budget.html" class="nav-link">
            <span class="nav-icon">🎯</span>
            Budget
        </a>

        <a href="reports.html" class="nav-link">
            <span class="nav-icon">📊</span>
            Reports
        </a>

        <a href="categories.html" class="nav-link">
            <span class="nav-icon">🏷️</span>
            Categories
        </a>

        <a href="settings.html" class="nav-link">
            <span class="nav-icon">⚙️</span>
            Settings
        </a>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="topbar">
            <h2>Add Expense</h2>

            <div class="account">
                👤 Tejas · Personal Account
            </div>
        </div>

        <div class="content">

            <h1 class="page-title">Add Expense 💸</h1>

            <p class="page-subtitle">
                Record a new expense in your ExpenseX account.
            </p>

            <div class="form-card">

                <form id="expenseForm">

                    <!-- AMOUNT -->
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required
                        >
                    </div>

                    <!-- DATE -->
                    <div class="form-group">
                        <label for="date">Date</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >
                    </div>

                    <!-- CATEGORY -->
                    <div class="form-group">
                        <label for="category">Category</label>

                        <select id="category" required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Food & Dining">
                                🍔 Food & Dining
                            </option>

                            <option value="Transport">
                                🚗 Transport
                            </option>

                            <option value="Bills">
                                🧾 Bills
                            </option>

                            <option value="Shopping">
                                🛍️ Shopping
                            </option>

                            <option value="Health">
                                ❤️ Health
                            </option>

                            <option value="Education">
                                📚 Education
                            </option>

                            <option value="Entertainment">
                                🎬 Entertainment
                            </option>

                            <option value="Other">
                                📦 Other
                            </option>

                        </select>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Enter expense description..."
                        ></textarea>

                    </div>

                    <!-- BUTTONS -->
                    <div class="button-row">

                        <button
                            type="submit"
                            class="save-btn"
                            id="saveButton"
                        >
                            💾 Save Expense
                        </button>

                        <a
                            href="expenses.html"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                    </div>

                    <div id="message" class="message"></div>

                </form>

            </div>

        </div>

    </main>

</div>


<script>

    /* SET TODAY'S DATE */
    document.getElementById("date").value =
        new Date().toISOString().split("T")[0];


    /* FORM SUBMIT */
    document.getElementById("expenseForm").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const amount =
                document.getElementById("amount").value;

            const date =
                document.getElementById("date").value;

            const category =
                document.getElementById("category").value;

            const description =
                document.getElementById("description").value;

            const message =
                document.getElementById("message");

            const saveButton =
                document.getElementById("saveButton");


            /* VALIDATION */

            if (!amount || Number(amount) <= 0) {

                message.className = "message error";

                message.textContent =
                    "Please enter a valid amount.";

                return;
            }


            if (!date) {

                message.className = "message error";

                message.textContent =
                    "Please select a date.";

                return;
            }


            if (!category) {

                message.className = "message error";

                message.textContent =
                    "Please select a category.";

                return;
            }


            /* BUTTON STATE */

            saveButton.disabled = true;

            saveButton.textContent =
                "Saving...";


            /* DATA */

            const expenseData = {

                amount: Number(amount),

                date: date,

                category: category,

                description: description

            };


            try {

                /* SEND DATA TO BACKEND */

                const response = await fetch(
                    "http://localhost:3000/expenses",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(expenseData)
                    }
                );


                const data =
                    await response.json();


                /* BACKEND ERROR */

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Failed to save expense."
                    );

                }


                /* SUCCESS */

                message.className =
                    "message success";

                message.textContent =
                    "✅ Expense saved successfully!";


                /* CLEAR FORM */

                document.getElementById(
                    "expenseForm"
                ).reset();


                /* SET DATE AGAIN */

                document.getElementById(
                    "date"
                ).value =
                    new Date()
                        .toISOString()
                        .split("T")[0];


                /*
                    AFTER 1 SECOND
                    GO TO EXPENSE LIST
                */

                setTimeout(function() {

                    window.location.href =
                        "expenses.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                message.className =
                    "message error";

                message.textContent =
                    "❌ Could not save expense. Make sure the backend server is running.";

            }


            /* RESET BUTTON */

            saveButton.disabled = false;

            saveButton.textContent =
                "💾 Save Expense";

        }

    );

</script>

</body>
</html>
